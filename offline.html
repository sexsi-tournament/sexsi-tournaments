<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>Няма връзка · SEXSI TOURNAMENTS</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080808;color:#fff;font-family:Arial,sans-serif;text-align:center}
    main{width:min(100%,520px);padding:36px 26px;border:1px solid #632026;border-radius:16px;background:linear-gradient(145deg,#191012,#0d0d0f);box-shadow:0 18px 60px #0009}
    .logo{font-size:28px;font-weight:1000;font-style:italic;letter-spacing:2px}
    .logo span{color:#ed252d}
    h1{margin:28px 0 12px;font-size:25px}
    p{color:#aaa;line-height:1.7;font-size:14px}
    button{margin-top:16px;padding:14px 22px;border:0;border-radius:7px;background:#ed252d;color:#fff;font-weight:900;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="logo">SEXSI<span>.</span></div>
    <h1>Няма интернет връзка</h1>
    <p>Запазените страници може да са достъпни, но за вход, турнири и актуални резултати е необходима връзка с интернет.</p>
    <button type="button" onclick="location.reload()">ОПИТАЙ ОТНОВО</button>
  </main>
</body>
</html>
