<!DOCTYPE html>
<html lang="bg"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909"><title>Recruitment Admin | SEXSI</title>
<link rel="stylesheet" href="elite.css?v=20261119-red6">
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
main{width:min(1200px,94%);margin:auto;padding:34px 0 70px}
h1{font-size:clamp(25px,4vw,40px)}p{color:#aaa;line-height:1.5}
.panel{background:#141414;border:1px solid #303030;border-radius:12px;padding:20px;margin:18px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.metric{background:#0d0d0d;border:1px solid #333;border-radius:9px;padding:16px}
.metric strong{display:block;font-size:28px;color:#ed252d}
.application{border:1px solid #333;border-radius:10px;padding:17px;margin:12px 0;background:#101010}
input,textarea,select{width:100%;background:#090909;color:#fff;border:1px solid #444;border-radius:7px;padding:11px;margin:6px 0 12px;font:inherit}
label{font-size:12px;font-weight:bold;color:#ddd}
button{background:#ed252d;color:white;border:0;border-radius:7px;padding:11px 15px;font-weight:900;cursor:pointer}
button.secondary{background:#292929;border:1px solid #555}
button:disabled{opacity:.5}
small,.muted{color:#999}
.status{padding:5px 9px;border-radius:30px;background:#292929;font-size:11px;font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.note{border-top:1px solid #333;padding:8px 0;color:#bbb;font-size:13px}
@media(max-width:600px){main{padding-top:20px}.panel{padding:15px}}
</style></head><body>
<header><a class="logo" href="index.html" style="color:white;text-decoration:none;font-weight:1000;font-size:27px">SEXSI<span style="color:#ed252d">.</span></a></header>
<main>
<div class="row"><div><div style="color:#ed252d;font-weight:900;letter-spacing:2px;font-size:11px">STAFF MANAGEMENT</div><h1>RECRUITMENT CONTROL</h1><p>Управление на кандидатури, интервюта и назначения.</p></div><a href="recruitment.html" style="color:#ff6268">Публични позиции ↗</a></div>
<section class="grid" id="metrics">
<div class="metric"><span class="muted">Всички кандидатури</span><strong id="totalCount">—</strong></div>
<div class="metric"><span class="muted">За разглеждане</span><strong id="pendingCount">—</strong></div>
<div class="metric"><span class="muted">Интервюта</span><strong id="interviewCount">—</strong></div>
<div class="metric"><span class="muted">Активен екип</span><strong id="staffCount">—</strong></div>
</section>
<section class="panel"><div class="row"><h2>КАНДИДАТУРИ</h2><button class="secondary" id="refresh">ОБНОВИ</button></div>
<div class="grid"><div><label for="filterStatus">ФИЛТЪР ПО СТАТУС</label><select id="filterStatus"><option value="">Всички</option><option value="submitted">Получени</option><option value="under_review">Разглеждат се</option><option value="interview">Интервю</option><option value="approved">Одобрени</option><option value="rejected">Отказани</option><option value="withdrawn">Оттеглени</option><option value="archived">Архивирани</option></select></div><div><label for="filterPosition">ПОЗИЦИЯ</label><select id="filterPosition"><option value="">Всички позиции</option></select></div></div>
<div id="applications"><p>Зареждане...</p></div><p id="adminMessage" aria-live="polite"></p></section>
<section class="panel"><h2>ЕКИП НА SEXSI</h2><div id="staffList"><p>Зареждане...</p></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
"use strict";
const URL="https://fyxlwcoochsuzhqostpe.supabase.co",KEY="sb_publishable_B_y2VUBIRuOdtN_57EJplQ_e-xoC5YP";
const db=window.sexsiSupabase||window.supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
const labels={submitted:"Получена",under_review:"Разглежда се",interview:"Интервю",approved:"Одобрена",rejected:"Отказана",withdrawn:"Оттеглена",archived:"Архивирана"};
let positions=[],apps=[],applicationProfileMap={};
function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}
function message(t){$("adminMessage").textContent=t;}
async function init(){
 const {data:s,error}=await db.auth.getSession();if(error||!s.session){location.href="profile.html";return;}
 const {data:a,error:e}=await db.rpc("sexsi_admin_get_access");
 if(e||!a?.authorized||!a.permissions?.includes("manage_recruitment")){$("applications").textContent="Нямаш право за достъп до Recruitment Control.";return;}
 await loadAll();
}
async function loadAll(){
 message("Зареждане на данните...");
 const [p,staff]=await Promise.all([
  db.from("sexsi_recruitment_positions").select("id,title,is_open").order("sort_order"),
  db.from("sexsi_staff_members").select("id,user_id,application_id,position_id,role_title,status,appointed_at,sexsi_recruitment_applications(discord_user_id)").order("appointed_at",{ascending:false})
 ]);
 if(p.error){message("Грешка при позициите: "+p.error.message);return;}
 positions=p.data||[];const filter=$("filterPosition");const current=filter.value;filter.replaceChildren(node("option","","Всички позиции"));
 positions.forEach(x=>{const o=node("option","",x.title);o.value=x.id;filter.append(o);});filter.value=current;
 if(staff.error){$("staffList").textContent="Грешка при екипа: "+staff.error.message;}else{
  const userIds=[...new Set((staff.data||[]).map(x=>x.user_id).filter(Boolean))];
  const {data:profiles,error:profileError}=userIds.length
   ? await db.rpc("sexsi_admin_get_profile_names",{p_user_ids:userIds})
   : {data:[],error:null};
  if(profileError){$("staffList").textContent="Грешка при зареждане на имената: "+profileError.message;return;}
  const profileMap=Object.fromEntries((profiles||[]).map(x=>[x.id,x.username]));
  renderStaff(staff.data||[],profileMap);
 }
 await loadApplications();
}
async function loadApplications(){
 const {data,error}=await db.from("sexsi_recruitment_applications").select("id,applicant_id,discord_user_id,experience,motivation,availability,portfolio_url,status,submitted_at,position_id,reviewed_by,reviewed_at,sexsi_recruitment_positions(title)").order("submitted_at",{ascending:false});
 if(error){message("Грешка при кандидатурите: "+error.message);return;}
 apps=data||[];
 const applicantIds=[...new Set(apps.map(x=>x.applicant_id).filter(Boolean))];
 const {data:profiles,error:profileError}=applicantIds.length
  ? await db.rpc("sexsi_admin_get_profile_names",{p_user_ids:applicantIds})
  : {data:[],error:null};
 if(profileError){message("Грешка при зареждане на имената на кандидатите: "+profileError.message);return;}
 applicationProfileMap=Object.fromEntries((profiles||[]).map(x=>[x.id,x.username]));
 $("totalCount").textContent=apps.length;
 $("pendingCount").textContent=apps.filter(x=>["submitted","under_review"].includes(x.status)).length;
 $("interviewCount").textContent=apps.filter(x=>x.status==="interview").length;
 $("staffCount").textContent="…";
 renderApps();message("");
 const {count}=await db.from("sexsi_staff_members").select("id",{count:"exact",head:true}).eq("status","active");
 $("staffCount").textContent=count??"—";
}
function renderApps(){
 const root=$("applications");root.replaceChildren();
 const status=$("filterStatus").value,pos=$("filterPosition").value;
 const rows=apps.filter(x=>(!status||x.status===status)&&(!pos||x.position_id===pos));
 if(!rows.length){root.append(node("p","","Няма кандидатури за избраните филтри."));return;}
 rows.forEach(app=>{
  const card=node("article","application"),top=node("div","row");
  const title=node("h3","",app.sexsi_recruitment_positions?.title||"Позиция");
  top.append(title,node("span","status",labels[app.status]||app.status));card.append(top);
  const applicantName=applicationProfileMap[app.applicant_id];
  card.append(node("p","",(applicantName?"Потребител: "+applicantName:"Discord ID: "+app.discord_user_id)+" · Подадена: "+new Date(app.submitted_at).toLocaleString("bg-BG")));
  card.append(node("h4","","Опит и умения"),node("p","",app.experience),node("h4","","Мотивация"),node("p","",app.motivation),node("h4","","Наличност"),node("p","",app.availability));
  if(app.portfolio_url){const link=node("a","","Отвори портфолио");link.href=app.portfolio_url;link.target="_blank";link.rel="noopener noreferrer";link.style.color="#ff6268";card.append(link);}
  const select=node("select");Object.entries(labels).forEach(([v,l])=>{const o=node("option","",l);o.value=v;select.append(o);});select.value=app.status;
  const save=node("button","","ЗАПАЗИ СТАТУС");save.addEventListener("click",()=>updateStatus(app,select.value,save));
  const note=node("textarea");note.rows=2;note.maxLength=5000;note.placeholder="Вътрешна бележка за екипа...";
  const addNote=node("button","secondary","ДОБАВИ БЕЛЕЖКА");addNote.addEventListener("click",()=>saveNote(app,note,addNote));
  const history=node("div","");const loadNotes=node("button","secondary","ПОКАЖИ БЕЛЕЖКИ");loadNotes.addEventListener("click",()=>showNotes(app,history,loadNotes));
  const actions=node("div","actions");actions.append(select,save,addNote,loadNotes);card.append(note,actions,history);
  if(app.status==="approved"){const hint=node("p","muted","Одобрена кандидатура. Проверка за назначение се извършва в списъка на екипа.");card.append(hint);}
  root.append(card);
 });
}
async function updateStatus(app,status,btn){
 btn.disabled=true;
 const {data:s}=await db.auth.getSession();
 if(!s.session){btn.disabled=false;message("Сесията е изтекла. Влез отново.");return;}
 const patch={status,reviewed_by:s.session.user.id,reviewed_at:new Date().toISOString()};
 const {error}=await db.from("sexsi_recruitment_applications").update(patch).eq("id",app.id);
 if(error){btn.disabled=false;message("Неуспешна промяна: "+error.message);return;}
 if(status==="approved"){
  const {data:existing,error:lookupError}=await db.from("sexsi_staff_members").select("id,status").eq("application_id",app.id).maybeSingle();
  if(lookupError){btn.disabled=false;message("Кандидатурата е одобрена, но проверката на екипа не успя: "+lookupError.message);await loadAll();return;}
  if(existing){
   if(["removed","inactive"].includes(existing.status)){
    const {error:restoreError}=await db.from("sexsi_staff_members").update({status:"active",ended_at:null}).eq("id",existing.id);
    if(restoreError){btn.disabled=false;message("Кандидатурата е одобрена, но служителят не беше активиран: "+restoreError.message);await loadAll();return;}
   }
  }else{
   const {error:staffError}=await db.from("sexsi_staff_members").insert({user_id:app.applicant_id,application_id:app.id,position_id:app.position_id,role_title:app.sexsi_recruitment_positions?.title||"SEXSI Staff",appointed_by:s.session.user.id});
   if(staffError){btn.disabled=false;message("Кандидатурата е одобрена, но назначаването не се записа: "+staffError.message);await loadAll();return;}
  }
 }else if(status==="rejected"||status==="withdrawn"){
  const {data:staffRows,error:staffLookupError}=await db.from("sexsi_staff_members").select("id,status").eq("application_id",app.id).in("status",["active","on_leave"]);
  if(staffLookupError){btn.disabled=false;message("Статусът на кандидатурата е променен, но проверката на екипа не успя: "+staffLookupError.message);await loadAll();return;}
  if(staffRows?.length){
   const {error:removeError}=await db.from("sexsi_staff_members").update({status:"removed",ended_at:new Date().toISOString()}).in("id",staffRows.map(x=>x.id));
   if(removeError){btn.disabled=false;message("Кандидатурата е променена, но служителят не беше освободен: "+removeError.message);await loadAll();return;}
  }
 }
 btn.disabled=false;message("Статусът е обновен.");await loadAll();
}
async function saveNote(app,field,btn){
 const value=field.value.trim();if(!value){message("Напиши бележка преди запис.");return;}
 btn.disabled=true;const {data:s}=await db.auth.getSession();
 const {error}=await db.from("sexsi_recruitment_notes").insert({application_id:app.id,author_id:s.session.user.id,note:value});
 btn.disabled=false;if(error){message("Бележката не беше записана: "+error.message);return;}
 field.value="";message("Бележката е записана.");
}
async function showNotes(app,root,btn){
 btn.disabled=true;const {data,error}=await db.from("sexsi_recruitment_notes").select("note,created_at,author_id").eq("application_id",app.id).order("created_at",{ascending:false});
 btn.disabled=false;root.replaceChildren();
 if(error){root.append(node("p","muted","Грешка при зареждане на бележките."));return;}
 if(!data.length){root.append(node("p","muted","Няма вътрешни бележки."));return;}
 data.forEach(n=>root.append(node("div","note",new Date(n.created_at).toLocaleString("bg-BG")+" · "+n.note)));
}
function renderStaff(rows,profileMap={}){
 const root=$("staffList");root.replaceChildren();
 if(!rows.length){root.append(node("p","","Все още няма назначени служители."));return;}
 rows.forEach(person=>{
  const card=node("article","application");
  const top=node("div","row");
  top.append(node("strong","",person.role_title||"SEXSI Staff"),node("span","status",({active:"АКТИВЕН",on_leave:"В ОТПУСК",inactive:"НЕАКТИВЕН",removed:"ОСВОБОДЕН"})[person.status]||person.status));
  card.append(top);
  const username=profileMap[person.user_id];
  card.append(node("p","muted","Потребител: "+(username||"Няма зададено име")+" · Назначен: "+new Date(person.appointed_at).toLocaleDateString("bg-BG")));
  const roleLabel=node("label","","ДЛЪЖНОСТ / РОЛЯ");
  const role=node("input");role.value=person.role_title||"";role.maxLength=100;role.placeholder="Напр. Moderator";
  const statusLabel=node("label","","СТАТУС");
  const status=node("select");
  [["active","Активен"],["on_leave","В отпуск"],["inactive","Неактивен"],["removed","Освободен"]].forEach(([v,l])=>{const o=node("option","",l);o.value=v;status.append(o);});
  status.value=person.status;
  const save=node("button","","ЗАПАЗИ ПРОМЕНИТЕ");
  save.addEventListener("click",async()=>{
   const title=role.value.trim();if(!title){message("Въведи длъжност за служителя.");return;}
   save.disabled=true;
   const {error}=await db.from("sexsi_staff_members").update({role_title:title,status:status.value,ended_at:["inactive","removed"].includes(status.value)?new Date().toISOString():null}).eq("id",person.id);
   save.disabled=false;
   if(error){message("Промените не са записани: "+error.message);return;}
   message("Данните на служителя са обновени.");await loadAll();
  });
  card.append(roleLabel,role,statusLabel,status,save);
  root.append(card);
 });
}
$("filterStatus").addEventListener("change",renderApps);$("filterPosition").addEventListener("change",renderApps);
$("refresh").addEventListener("click",loadAll);init();
})();
</script><script src="site-nav.js?v=5"></script></body></html>
