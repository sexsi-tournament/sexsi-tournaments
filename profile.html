
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>Профил | SEXSI TOURNAMENTS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
header{padding:20px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929}
.logo{font-size:28px;font-weight:900;letter-spacing:3px}
.logo span{color:#ed252d}
nav a{color:#bbb;text-decoration:none;margin-left:15px;font-size:13px}
section{padding:45px 7%;max-width:750px;margin:auto}
h1{font-size:30px}
h2{color:#ed252d}
.card{background:#141414;border:1px solid #303030;padding:24px;border-radius:8px;margin:20px 0}
input{display:block;width:100%;padding:14px;margin:12px 0;background:#090909;border:1px solid #444;border-radius:5px;color:white}
button{background:#ed252d;color:white;border:0;padding:14px 20px;border-radius:5px;font-weight:bold;cursor:pointer}
.message{color:#aaa;min-height:20px}
footer{padding:30px 7%;border-top:1px solid #292929;color:#777;font-size:12px}
@media(max-width:600px){header{padding:18px 4%}nav a{margin-left:7px;font-size:10px}section{padding:35px 5%}}
</style>
</head>
<body>
<header>
<div class="logo">SEXSI<span>.</span></div>
<nav>
<a href="index.html">НАЧАЛО</a>
<a href="tournaments.html">ТУРНИРИ</a>
<a href="ranking.html">КЛАСАЦИЯ</a>
<a href="profile.html">ПРОФИЛ</a>
</nav>
</header>

<section>
<h1>ПОТРЕБИТЕЛСКИ ПРОФИЛ</h1>

<div id="register">
<div class="card">
<h2>СЪЗДАЙ АКАУНТ</h2>
<form id="registerForm">
<input id="username" type="text" placeholder="Username" required>
<input id="playerGameId" type="text" placeholder="Твоето ID в Standoff 2" required>
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password (minimum 6 characters)" required>
<button type="submit">СЪЗДАЙ АКАУНТ</button>
</form>
<p id="registerMessage" class="message"></p>
</div>

<div class="card">
<h2>ВЛЕЗ В ПРОФИЛА СИ</h2>
<form id="loginForm">
<input id="loginEmail" type="email" placeholder="Email" required>
<input id="loginPassword" type="password" placeholder="Password" required>
<button type="submit">ВЛЕЗ</button>
</form>
<p id="loginMessage" class="message"></p>
</div>
</div>
<div id="playerDashboard" class="card" style="display:none">
  <h2>МОЯТ ПРОФИЛ</h2>

  <p>Потребител: <strong id="playerName"></strong></p>
  <p>Имейл: <strong id="playerEmail"></strong></p>
  <p>Standoff 2 ID: <strong id="playerId"></strong></p>

  <h3>ПРОМЯНА НА GAME ID</h3>

  <input id="editPlayerGameId" type="text" placeholder="Ново Standoff 2 ID">

  <button type="button" id="savePlayerGameId">ЗАПАЗИ ID</button>
  <p id="playerGameIdMessage" class="message"></p>

  <button type="button" id="logoutButton">ИЗХОД ОТ ПРОФИЛА</button>
</div>
  <div id="adminPanel" class="card" style="display:none">
  <h2>АДМИНИСТРАТОРСКИ ПАНЕЛ</h2>
  <p>Имаш администраторски достъп.</p>
  <a href="admin.html" style="color:#ed252d">ОТВОРИ АДМИН ПАНЕЛА</a>
  </div>
</section>

<footer>SEXSI TOURNAMENTS © 2026 · STANDOFF 2 COMMUNITY</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
