<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Новини | SEXSI TOURNAMENTS</title>
<meta name="description" content="Официални новини, съобщения и резултати от SEXSI TOURNAMENTS.">
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;min-height:100vh}
header{padding:18px 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292929;background:#101010}
.logo{font-size:22px;font-weight:1000;font-style:italic;letter-spacing:1px}.logo span{color:#ed252d}
header a{color:#bbb;text-decoration:none;font-size:11px;font-weight:900;letter-spacing:1px}
main{max-width:1100px;margin:0 auto;padding:45px 20px 70px}
.eyebrow{color:#ff6268;font-size:10px;font-weight:900;letter-spacing:4px}
h1{font-size:clamp(32px,6vw,54px);margin:10px 0 8px;letter-spacing:-1.5px}
.intro{color:#999;line-height:1.7;font-size:14px;margin:0 0 28px}
#newsList{display:grid;gap:15px}
.news-card{padding:22px;border:1px solid #302326;border-radius:11px;background:linear-gradient(145deg,#171719,#0d0d0f);scroll-margin-top:20px}
.news-meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;color:#999;font-size:10px;font-weight:800;letter-spacing:1px}
.news-category{color:#ff777c;background:rgba(237,37,45,.12);padding:6px 9px;border-radius:4px}
.news-card h2{font-size:21px;line-height:1.3;margin:14px 0 9px}
.news-summary{color:#bbb;font-size:13px;line-height:1.7;margin:0 0 12px}
.news-content{color:#ddd;font-size:14px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
.news-pinned{border-color:rgba(233,189,89,.55);box-shadow:0 0 25px rgba(233,189,89,.06)}
.status{padding:24px;text-align:center;color:#999;border:1px dashed #333;border-radius:9px}
footer{text-align:center;padding:22px;color:#666;border-top:1px solid #222;font-size:10px;letter-spacing:1px}
@media(min-width:760px){#newsList{grid-template-columns:1fr 1fr}.news-card:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<header><div class="logo">SEXSI <span>TOURNAMENTS</span></div><a href="index.html">← КЪМ НАЧАЛОТО</a></header>
<main>
  <div class="eyebrow">ОФИЦИАЛЕН ИНФОРМАЦИОНЕН КАНАЛ</div>
  <h1>НОВИНИ</h1>
  <p class="intro">Последни съобщения, турнирни новини, резултати и информация за общността на SEXSI TOURNAMENTS.</p>
  <div id="newsList"><div class="status">Зареждане на публикациите...</div></div>
</main>
<footer>SEXSI TOURNAMENTS © 2026 · STANDOFF 2 COMMUNITY</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
 const db=window.supabase.createClient("https://fyxlwcoochsuzhqostpe.supabase.co","sb_publishable_B_y2VUBIRuOdtN_57EJplQ_e-xoC5YP");
 const list=document.getElementById("newsList");
 db.from("sexsi_news").select("id,title,summary,content,category,published_at,is_pinned")
  .eq("is_published",true).order("is_pinned",{ascending:false})
  .order("published_at",{ascending:false}).then(({data,error})=>{
   list.innerHTML="";
   if(error||!data||!data.length){const empty=document.createElement("div");empty.className="status";empty.textContent=error?"Новините временно не могат да се заредят.":"Все още няма публикувани новини.";list.appendChild(empty);return}
   data.forEach(item=>{
    const card=document.createElement("article");card.className="news-card"+(item.is_pinned?" news-pinned":"");card.id=item.id;
    const meta=document.createElement("div");meta.className="news-meta";
    const category=document.createElement("span");category.className="news-category";category.textContent=item.category;
    const date=document.createElement("span");date.textContent=new Date(item.published_at).toLocaleString("bg-BG",{dateStyle:"medium",timeStyle:"short"});
    if(item.is_pinned){const pin=document.createElement("span");pin.textContent="★ ВАЖНО";meta.appendChild(pin)}
    meta.append(category,date);
    const title=document.createElement("h2");title.textContent=item.title;
    card.append(meta,title);
    if(item.summary){const summary=document.createElement("p");summary.className="news-summary";summary.textContent=item.summary;card.appendChild(summary)}
    const content=document.createElement("div");content.className="news-content";content.textContent=item.content;card.appendChild(content);
    list.appendChild(card);
   });
   if(location.hash){const target=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(target)target.scrollIntoView()}
  });
})();
</script>
</body>
</html>
