<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080809">
<title>Моите двубои | SEXSI TOURNAMENTS</title>
<meta name="description" content="Следи личните си двубои, съперниците, графика и резултатите в SEXSI TOURNAMENTS.">
<link rel="stylesheet" href="elite.css?v=3">
<style>
*{box-sizing:border-box}
body{margin:0;background:#080809;color:#f7f7f8;font-family:Arial,sans-serif}
header{padding:18px 7%;display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid #292929}
.logo{font-size:28px;font-weight:1000;font-style:italic;letter-spacing:2px;text-decoration:none;color:#fff}
.logo span{color:#ed252d}
header nav{display:flex;gap:18px;flex-wrap:wrap}
header nav a{color:#aaa;text-decoration:none;font-size:11px;font-weight:900}
main{max-width:950px;margin:auto;padding:42px 6%}
.eyebrow{color:#ff6268;font-size:11px;font-weight:900;letter-spacing:3px}
h1{font-size:clamp(30px,6vw,48px);margin:10px 0}
.lead{color:#aaa;font-size:14px;line-height:1.7}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0}
.match-card{padding:18px;margin:12px 0;background:#151517;border:1px solid #343034;border-radius:12px}
.match-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#e9bd59;font-size:12px;font-weight:900}
.players{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:18px 0}
.players strong:last-child{text-align:right}
.versus{font-size:19px;font-weight:1000;color:#ed252d}
.meta{color:#aaa;font-size:13px;line-height:1.8}
.status{font-size:12px;font-weight:900}
.empty,.notice{padding:20px;border:1px dashed #484044;border-radius:10px;color:#aaa;text-align:center;line-height:1.7}
button{padding:12px 17px;background:#ed252d;color:#fff;border:0;border-radius:8px;font-weight:900;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
@media(max-width:650px){header{padding:15px 5%;align-items:flex-start;flex-direction:column}main{padding:30px 5%}.match-card{padding:15px}.players{gap:7px;font-size:13px}}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">SEXSI<span>.</span></a>
<nav aria-label="Основна навигация">
<a href="index.html">НАЧАЛО</a>
<a href="tournaments.html">ТУРНИРИ</a>
<a href="matches.html" aria-current="page">МОИТЕ ДВУБОИ</a>
<a href="archive.html">АРХИВ</a>
<a href="ranking.html">КЛАСАЦИЯ</a>
<a href="profile.html">ПРОФИЛ</a>
</nav>
</header>
<main>
<div class="eyebrow">PLAYER DASHBOARD · STANDOFF 2</div>
<h1>МОИТЕ ДВУБОИ</h1>
<p class="lead">Тук ще виждаш личните си срещи, съперниците, насрочените часове и резултатите от турнирите.</p>
<div class="toolbar">
<strong id="matchSummary">Проверка на профила...</strong>
<button id="refreshMatches" type="button">ОБНОВИ</button>
</div>
<div id="matchesList" aria-live="polite"><div class="empty">Зареждане на личните двубои...</div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const matchesDb = window.supabase.createClient(
  "https://fyxlwcoochsuzhqostpe.supabase.co",
  "sb_publishable_B_y2VUBIRuOdtN_57EJplQ_e-xoC5YP",
  {auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}}
);
const list = document.getElementById("matchesList");
const summary = document.getElementById("matchSummary");
const refreshButton = document.getElementById("refreshMatches");

function showMessage(message, isError=false){
  list.replaceChildren();
  const box=document.createElement("div");
  box.className=isError?"notice":"empty";
  box.textContent=message;
  list.appendChild(box);
}

async function loadMatches(){
  refreshButton.disabled=true;
  refreshButton.textContent="ЗАРЕЖДАНЕ...";
  const {data:sessionData,error:sessionError}=await matchesDb.auth.getSession();
  if(sessionError || !sessionData.session){
    summary.textContent="Не си влязъл в профила си";
    showMessage("За да виждаш личните си двубои, първо влез в профила си.",false);
    const link=document.createElement("a");
    link.href="profile.html#loginForm";
    link.textContent="ВЛЕЗ В ПРОФИЛА";
    link.className="btn";
    list.firstChild.appendChild(document.createElement("br"));
    list.firstChild.appendChild(link);
    refreshButton.disabled=false;
    refreshButton.textContent="ОБНОВИ";
    return;
  }

  const userId=sessionData.session.user.id;
  const {data,error}=await matchesDb.rpc("sexsi_get_public_bracket");
  if(error){
    console.error("Personal matches error:",error.message);
    summary.textContent="Двубоите не са достъпни";
    showMessage("В момента не успяхме да заредим турнирната схема. Опитай отново.",true);
    refreshButton.disabled=false;
    refreshButton.textContent="ОБНОВИ";
    return;
  }

  const matches=Array.isArray(data)?data:[];
  const {data:scheduleData,error:scheduleError}=await matchesDb.rpc("sexsi_get_public_match_schedules");
  if(!scheduleError){
    const schedules=new Map((Array.isArray(scheduleData)?scheduleData:[]).map(item=>[item.match_id,item.scheduled_at]));
    matches.forEach(match=>{match.scheduled_at=schedules.get(match.id)||null;});
  }
  const mine=matches.filter(match=>match.player1_id===userId||match.player2_id===userId)
    .sort((a,b)=>Number(a.round_number)-Number(b.round_number)||Number(a.match_number)-Number(b.match_number));

  summary.textContent=mine.length?("Намерени двубои: "+mine.length):"Все още нямаш насрочени двубои";
  if(!mine.length){
    showMessage(matches.length
      ?"Турнирната схема е създадена, но все още няма двубой, свързан с твоя профил. Провери дали Game ID-то ти съвпада с регистрацията."
      :"Личните ти двубои ще се появят тук, след като бъде създадена турнирната схема.");
    refreshButton.disabled=false;
    refreshButton.textContent="ОБНОВИ";
    return;
  }

  list.replaceChildren();
  mine.forEach(match=>{
    const isPlayer1=match.player1_id===userId;
    const ownName=isPlayer1?match.player1_name:match.player2_name;
    const opponentName=isPlayer1?match.player2_name:match.player1_name;
    const ownScore=isPlayer1?match.score_player1:match.score_player2;
    const opponentScore=isPlayer1?match.score_player2:match.score_player1;
    const card=document.createElement("article");
    card.className="match-card";
    const top=document.createElement("div");
    top.className="match-top";
    top.textContent="КРЪГ "+(match.round_number||"—")+" · МАЧ №"+(match.match_number||"—")+" · SEXSI 1V1 CUP #001";
    const players=document.createElement("div");
    players.className="players";
    const own=document.createElement("strong");
    own.textContent=ownName||"ТВОЯТ ПРОФИЛ";
    const versus=document.createElement("span");
    versus.className="versus";
    versus.textContent=(ownScore==null||opponentScore==null)?"VS":ownScore+" : "+opponentScore;
    const opponent=document.createElement("strong");
    opponent.textContent=opponentName||"ОЧАКВА СЕ СЪПЕРНИК";
    players.append(own,versus,opponent);
    const schedule=document.createElement("p");
    schedule.className="meta";
    schedule.textContent=match.scheduled_at
      ?"НАСРОЧЕН ДВУБОЙ: "+new Date(match.scheduled_at).toLocaleString("bg-BG",{dateStyle:"medium",timeStyle:"short"})
      :"ЧАС: Все още не е уговорен";
    const status=document.createElement("p");
    status.className="status";
    status.textContent=match.status==="completed"
      ?(match.winner_id===userId?"ПОБЕДА":"ЗАГУБА")
      :match.status==="ongoing"?"ДВУБОЯТ Е В ХОД":"ПРЕДСТОИ";
    status.style.color=match.status==="completed"?"#65e69a":"#e9bd59";
    card.append(top,players,schedule,status);
    list.appendChild(card);
  });
  refreshButton.disabled=false;
  refreshButton.textContent="ОБНОВИ";
}
refreshButton.addEventListener("click",loadMatches);
loadMatches();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="chat-notifications.js?v=1"></script>
<script src="analytics.js?v=1"></script>
</body>
</html>
